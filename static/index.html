<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator CV</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="LoadProjects()">
    <div class="form-wrapper">
        
        <div class="project-selector">
            <label for="projekty">Wybierz zapisany projekt z listy:</label>
            <select id="projekty" onchange="LoadData()"></select>
        </div>

       <div class="form-grid">
            <div class="form-group span-full project-name">
                <input type="text" id="tytul" placeholder="Nazwa projektu">
            </div>

            <div class="form-group">
                <label for="nazwisko">Imię i nazwisko</label>
                <input type="text" id="nazwisko" placeholder="Imię i nazwisko">
            </div>

            <div class="form-group">
                <label for="file">Zdjęcie</label>
                <input type="file" id="file">
            </div>

            <div class="form-group">
                <label for="telefon">Nr telefonu</label>
                <input type="tel" id="telefon" placeholder="Nr telefonu">
            </div>

            <div class="form-group">
                <label for="dataUrodzenia">Data urodzenia</label>
                <input type="date" id="dataUrodzenia">
            </div>

            <div class="form-group">
                <label for="wyksztalcenie">Wykształcenie</label>
                <select id="wyksztalcenie">
                    <option value="p">Podstawowe</option>
                    <option value="s">Średnie</option>
                    <option value="w">Wyższe</option>
                </select>
            </div>

            <div class="form-group">
                <label for="szkola">Nazwa uczelni/szkoły</label>
                <input type="text" id="szkola" placeholder="Nazwa uczelni/szkoły">
            </div>

            <div class="form-group span-full">
                <label for="opis">O mnie</label>
                <textarea id="opis" rows="6" placeholder="O mnie..."></textarea>
            </div>

            <div class="form-group span-full">
                <label for="doswiadczenie">Doświadczenie</label>
                <textarea id="doswiadczenie" rows="6" placeholder="Doświadczenie"></textarea>
            </div>

            <div class="form-actions">
                <button onclick="SaveData()">Zapisz</button>
                <button onclick="PrintDocument()">Wydrukuj</button>
            </div>
        </div>
    </div>

    <div id="templateModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage" alt="Selected Template Preview">
    </div>

    <script src="script.js"></script>
</body>

</html>
